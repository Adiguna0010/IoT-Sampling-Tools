services:
  - type: web
    name: iot-chamber-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: Vanguard_Tools_Online/API
    buildCommand: npm install
    startCommand: node server_mirna.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: iot_padi
      - key: DATABASE_URL
        sync: false
