<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - IoT Sampling Tools</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

<div class="login-container">
    <div class="login-card">
        <div class="text-center mb-4">
            <div class="logo justify-content-center mb-2">
                <i class="bi bi-cpu" style="font-size: 40px;"></i>
            </div>
            <h3 class="fw-bold section-title">IoT Sampling Tools</h3>
            <p class="text-muted">Sistem Monitoring Terpadu</p>
        </div>
        
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label fw-bold">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="username" placeholder="Masukkan username" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" placeholder="Masukkan password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-brin w-100 py-2 fs-5">Masuk <i class="bi bi-box-arrow-in-right"></i></button>
            
            <!-- Teks bantuan untuk percobaan awal -->
            <div class="mt-4 text-center p-3 bg-light rounded border" style="font-size: 12px;">
                <b>Akses Demo:</b><br>
                <span class="text-primary">Operator:</span> user: <b>operator</b> | pass: <b>admin123</b><br>
                <span class="text-success">User Biasa:</span> user: <b>tamu</b> | pass: <b>user123</b>
            </div>
        </form>
    </div>
</div>

<script>
    // Cek apakah sudah login, jika ya, langsung arahkan ke dashboard
    if(sessionStorage.getItem("role")) {
        window.location.href = "dashboard.html";
    }

    document.getElementById("loginForm").addEventListener("submit", function(e) {
        e.preventDefault();
        
        const user = document.getElementById("username").value;
        const pass = document.getElementById("password").value;

        // Logika Pengecekan Akun Sederhana
        if (user === "operator" && pass === "admin123") {
            sessionStorage.setItem("role", "operator");
            sessionStorage.setItem("username", "Operator Utama");
            window.location.href = "dashboard.html";
        } else if (user === "tamu" && pass === "user123") {
            sessionStorage.setItem("role", "user");
            sessionStorage.setItem("username", "Tamu Publik");
            window.location.href = "dashboard.html";
        } else {
            alert("Username atau Password salah! Silakan periksa kembali.");
        }
    });
</script>

</body>
</html>
