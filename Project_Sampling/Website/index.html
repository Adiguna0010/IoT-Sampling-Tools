<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IoT Sampling Tools</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
    <div class="logo">
        <i class="bi bi-cpu"></i> IoT Sampling Tools
    </div>
    <div class="status">
        <span class="online-dot"></span> ONLINE
    </div>
</nav>

<!-- Container Utama -->
<div class="container-fluid p-4">

    <!-- 3 Info Cards (Alarm Dihilangkan, sisa 3 diubah ukurannya agar pas) -->
    <div class="row g-4">
        <div class="col-md-4">
            <div class="info-card">
                <h6>Total Chamber</h6>
                <h2 id="jumlahChamber">1</h2>
            </div>
        </div>
        <div class="col-md-4">
            <div class="info-card">
                <h6>Online</h6>
                <h2 id="online">1</h2>
            </div>
        </div>
        <div class="col-md-4">
            <div class="info-card">
                <h6>Last Update</h6>
                <h2 id="clock">--:--</h2>
            </div>
        </div>
    </div>

    <!-- Judul Seksi dan Tombol -->
    <div class="mt-4 mb-4 d-flex justify-content-between align-items-center">
        <h3 class="fw-bold section-title">Monitoring Chamber</h3>
        <div>
            <button class="btn btn-secondary me-2" onclick="kurangiChamber()">
                <i class="bi bi-dash-circle"></i> Kurangi Chamber
            </button>
            <button class="btn btn-brin" onclick="tambahChamber()">
                <i class="bi bi-plus-circle"></i> Tambah Chamber
            </button>
        </div>
    </div>

    <!-- Tempat menampung Card Chamber -->
    <div class="row" id="containerChamber">
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
